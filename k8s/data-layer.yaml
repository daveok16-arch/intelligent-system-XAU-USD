# Persistent state layer.
#
# Corrections vs the directive draft:
#   1. `ReadWriteMany` is not supported by most CSI drivers (EBS, GCE PD, and kind's
#      local-path all refuse it), so the PVC would stay Pending forever. More
#      importantly RWX is the wrong tool here: the design goal is a SINGLE writer.
#   2. The draft had ONE PVC shared by both CronJobs, giving no writer isolation --
#      macro and spatial could write concurrently. Each writer now has its own
#      ReadWriteOnce PVC, enforcing the single-writer constraint at the storage layer
#      rather than trusting wall-clock schedule separation.
#   3. The Namespace was referenced by every object but never created.
#   4. The Secret the workloads consume was never defined.
#
# Reader topology note: the API Deployment mounts the *macro* volume read-only. With
# multiple API replicas (the HPA does this), a ReadWriteOnce volume cannot be mounted
# by pods on different nodes. See the note in web-layer.yaml.

apiVersion: v1
kind: Namespace
metadata:
  name: gold-intelligence
---
# Single-writer volume for the weekly macro repository.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: macro-data-pvc
  namespace: gold-intelligence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Single-writer volume for the daily spatial repository.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: spatial-data-pvc
  namespace: gold-intelligence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
# Credential consumed by the CronJobs and the API via envFrom.
#
# The key MUST be named SYSTEM_AUTH_TOKEN: `envFrom` maps each key to an identically
# named environment variable, so a key of AUTH_TOKEN would yield $AUTH_TOKEN and the
# application would never see its credential.
#
# Do NOT commit a real token. Create out-of-band, e.g.:
#   kubectl -n gold-intelligence create secret generic system-auth-credentials \
#     --from-literal=SYSTEM_AUTH_TOKEN="$(openssl rand -base64 32)"
# Swap the source for Vault / Secrets Store CSI without touching the workloads.
apiVersion: v1
kind: Secret
metadata:
  name: system-auth-credentials
  namespace: gold-intelligence
type: Opaque
stringData:
  SYSTEM_AUTH_TOKEN: "REPLACE_ME_NOT_A_REAL_TOKEN"
