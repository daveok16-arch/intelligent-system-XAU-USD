# Persistent state layer.
#
# Corrections vs the directive draft:
#   1. `ReadWriteMany` is not supported by most CSI drivers (EBS, GCE PD, and kind's
#      local-path all refuse it), so the PVC would stay Pending forever.
#   2. The draft had ONE PVC shared by both CronJobs, giving no writer isolation.
#   3. The Namespace was referenced by every object but never created.
#   4. The Secret the workloads consume was never defined.
#
# Storage topology (corrected): both writers publish into a SHARED repository volume
# mounted at /workspace/project/data, each writing its own distinct file, plus the
# data/history/ subdirectory holding the multi-decade reference store. A single
# ReadWriteOnce volume is safe because exactly ONE writer pod is ever active at a time
# (concurrencyPolicy: Forbid, and the jobs write different files). The read-only API and
# cockpit see every file.
#
# Reader topology: the API/cockpit mount this volume read-only. ReadWriteOnce means all
# reader pods must be scheduled on the SAME node as the volume, so a multi-node HPA
# fan-out is NOT supported by this topology -- use a shared read-only CSI volume or
# object store before scaling across nodes.

apiVersion: v1
kind: Namespace
metadata:
  name: gold-intelligence
---
# Single shared repository volume. Distinct files per writer; at most one writer pod
# is active at a time, so ReadWriteOnce is correct and sufficient.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: institutional-data-pvc
  namespace: gold-intelligence
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# Credential consumed by the CronJobs and the API via envFrom.
#
# The key MUST be named SYSTEM_AUTH_TOKEN: `envFrom` maps each key to an identically
# named environment variable, so a key of AUTH_TOKEN would yield $AUTH_TOKEN and the
# application would never see its credential.
#
# Do NOT commit a real token. Create out-of-band, e.g.:
#   kubectl -n gold-intelligence create secret generic system-auth-credentials \
#     --from-literal=SYSTEM_AUTH_TOKEN="$(openssl rand -base64 32)"
# Swap the source for Vault / Secrets Store CSI without touching the workloads.
apiVersion: v1
kind: Secret
metadata:
  name: system-auth-credentials
  namespace: gold-intelligence
type: Opaque
stringData:
  SYSTEM_AUTH_TOKEN: "REPLACE_ME_NOT_A_REAL_TOKEN"

